name: ARCHITECTON CONTROL validate
on:
  push:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_config.py
      - run: python tests/test_control_mvp.py
      - uses: actions/upload-artifact@v4
        with:
          name: farm56-control-mvp-evidence
          path: artifacts/control_mvp.json
